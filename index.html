<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nico Rubino</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono@1&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
    }
    #overlay.active { display: flex; }
    .overlay-card {
      background: #f5f0e8; color: #1a1410;
      max-width: 540px; width: 92%; max-height: 82vh; overflow-y: auto;
      border-radius: 12px; padding: 2rem 2rem 1.5rem; position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .overlay-card h2 {
      font-size: 1.15rem; font-weight: 700; color: #2a1a0e;
      border-bottom: 2px solid #d4c9b0; padding-bottom: 0.5rem; margin-bottom: 1rem;
    }
    .overlay-card .close-btn {
      position: absolute; top: 0.8rem; right: 1rem;
      background: none; border: none; font-size: 1.6rem; cursor: pointer;
      color: #8a7a6a; font-family: 'Inter', sans-serif; line-height: 1;
    }
    .overlay-card .close-btn:hover { color: #2a1a0e; }
    .overlay-card .section {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #8a7a6a; font-weight: 600; margin: 0.8rem 0 0.25rem;
    }
    .overlay-card .bullet {
      font-size: 0.78rem; color: #4a3a2a; padding: 0.1rem 0 0.1rem 0.8rem;
      position: relative; line-height: 1.55;
    }
    .overlay-card .bullet::before {
      content: '›'; position: absolute; left: 0; color: #b0a090; font-weight: 700;
    }
    .overlay-card .btn {
      display: inline-block; background: #2a1a0e; color: #f5f0e8;
      padding: 0.5rem 1.3rem; border-radius: 8px; text-decoration: none;
      font-size: 0.8rem; font-weight: 600; margin-top: 0.75rem; border: none; cursor: pointer;
      transition: all 0.2s;
    }
    .overlay-card .btn:hover { background: #3a2a1a; transform: translateY(-1px); }

    .tooltip {
      position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
      background: #f5f0e8; color: #1a1410; padding: 0.6rem 1.4rem;
      border-radius: 8px; font-size: 0.82rem; z-index: 80;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      opacity: 0; transition: opacity 0.35s; pointer-events: none;
      max-width: 92%; text-align: center;
    }
    .tooltip.visible { opacity: 1; }

    .hint {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-size: 0.65rem; z-index: 30;
      letter-spacing: 0.03em; pointer-events: none;
    }

    @media (max-width: 600px) {
      .overlay-card { padding: 1.25rem; }
      .overlay-card h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="overlay"><div class="overlay-card" id="overlay-card">
    <button class="close-btn" onclick="closeOverlay()">×</button>
    <div id="overlay-content"></div>
  </div></div>
  <div class="tooltip" id="tooltip"></div>
  <div class="hint">Click objects to explore — try the filing cabinet, monitor, stapler, corkboard</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
