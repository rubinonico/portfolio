<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Rubino — Terminal</title>
<style>
  /* ── CRT Terminal Theme (Balatro/Fallout inspired) ── */
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --crt-green: #00ff41;
    --crt-green-dim: #00aa28;
    --crt-amber: #ffb000;
    --crt-bg: #0a0f0a;
    --crt-screen: #0d1a0d;
    --crt-border: #1a3a1a;
    --crt-text: #b0ffb0;
    --crt-text-dim: #4a8a4a;
    --crt-highlight: #00ff41;
    --crt-red: #ff3355;
    --crt-blue: #4488ff;
    --crt-scanline: rgba(0, 255, 65, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050805;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    padding: 1rem;
  }

  /* ── CRT Monitor Frame ── */
  .monitor {
    background: #111;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 0 60px rgba(0, 255, 65, 0.05), inset 0 0 40px rgba(0,0,0,0.8);
    max-width: 900px;
    width: 100%;
    border: 2px solid #222;
    position: relative;
  }

  .monitor::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(0,255,65,0.02) 0%, transparent 30%, transparent 70%, rgba(0,255,65,0.02) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .screen {
    background: var(--crt-screen);
    border-radius: 12px;
    padding: 2rem;
    min-height: 500px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--crt-border);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
  }

  /* ── Scanlines ── */
  .screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--crt-scanline) 2px,
      var(--crt-scanline) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* ── Screen Glow ── */
  .screen::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* ── Terminal Content ── */
  .terminal {
    position: relative;
    z-index: 3;
    color: var(--crt-text);
    font-size: 14px;
    line-height: 1.6;
  }

  .terminal .header {
    text-align: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--crt-border);
  }

  .terminal .header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.2rem;
    color: var(--crt-green);
    text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
    margin-bottom: 0.5rem;
    letter-spacing: 2px;
  }

  .terminal .header .subtitle {
    color: var(--crt-text-dim);
    font-size: 0.75rem;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 1px;
  }

  .terminal .status-bar {
    display: flex;
    justify-content: space-between;
    color: var(--crt-text-dim);
    font-size: 0.7rem;
    margin-bottom: 1rem;
    padding: 0.25rem 0.5rem;
    border: 1px solid var(--crt-border);
    background: rgba(0,0,0,0.3);
  }

  .terminal .status-bar .blink {
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .terminal .prompt-line {
    color: var(--crt-green);
    margin-bottom: 0.75rem;
  }

  .terminal .prompt-line .prompt {
    color: var(--crt-green);
  }

  .terminal .prompt-line .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--crt-green);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }

  /* ── Menu Items ── */
  .menu {
    margin: 1rem 0;
  }

  .menu-item {
    display: flex;
    align-items: center;
    padding: 0.4rem 0.5rem;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--crt-text-dim);
    text-decoration: none;
  }

  .menu-item:hover {
    background: rgba(0, 255, 65, 0.05);
    color: var(--crt-green);
  }

  .menu-item .arrow {
    color: var(--crt-green-dim);
    margin-right: 0.75rem;
    font-size: 0.8rem;
    width: 1.2rem;
  }

  .menu-item .title {
    flex: 1;
  }

  .menu-item .badge {
    font-size: 0.65rem;
    padding: 0.1rem 0.4rem;
    border: 1px solid var(--crt-border);
    color: var(--crt-text-dim);
  }

  .menu-item .badge.live {
    border-color: var(--crt-green-dim);
    color: var(--crt-green);
  }

  .menu-item.active {
    background: rgba(0, 255, 65, 0.08);
    color: var(--crt-green);
  }

  .menu-item.active .arrow {
    color: var(--crt-green);
  }

  /* ── Content Panel ── */
  .content-panel {
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--crt-border);
    background: rgba(0,0,0,0.3);
    min-height: 120px;
  }

  .content-panel h3 {
    color: var(--crt-green);
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .content-panel .section-label {
    color: var(--crt-text-dim);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.25rem;
  }

  .content-panel .bullet {
    color: var(--crt-text);
    font-size: 0.8rem;
    padding: 0.15rem 0;
    padding-left: 1rem;
    position: relative;
  }

  .content-panel .bullet::before {
    content: '>';
    position: absolute;
    left: 0;
    color: var(--crt-green-dim);
  }

  .content-panel .skill-tag {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.1rem 0.5rem;
    margin: 0.15rem;
    border: 1px solid var(--crt-border);
    color: var(--crt-text);
  }

  .content-panel .skill-tag.highlight {
    border-color: var(--crt-green-dim);
    color: var(--crt-green);
  }

  /* ── Footer ── */
  .terminal .footer {
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--crt-border);
    font-size: 0.7rem;
    color: var(--crt-text-dim);
    text-align: center;
  }

  .terminal .footer a {
    color: var(--crt-text-dim);
    text-decoration: none;
  }

  .terminal .footer a:hover {
    color: var(--crt-green);
  }

  /* ── Help text ── */
  .help-text {
    font-size: 0.7rem;
    color: var(--crt-text-dim);
    text-align: center;
    margin-top: 0.5rem;
  }

  .help-text kbd {
    border: 1px solid var(--crt-border);
    padding: 0.05rem 0.3rem;
    font-size: 0.65rem;
    color: var(--crt-text);
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .monitor { padding: 12px; }
    .screen { padding: 1rem; }
    .terminal { font-size: 12px; }
    .terminal .header h1 { font-size: 0.9rem; }
  }
</style>
</head>

// ── State ──
let currentSection = 'about';
const sections = ['about', 'experience', 'education', 'skills', 'projects', 'contact'];

// ── Render ──
function renderContent(section) {
  const d = data[section];
  if (!d) return;

  document.getElementById('content-title').textContent = d.title;

  let html = '';
  for (const item of d.body) {
    if (item.type === 'label') {
      html += `<div class="section-label">${item.text}</div>`;
    } else if (item.type === 'text') {
      const cls = item.extra_class ? ` class="${item.extra_class}"` : '';
      html += `<div class="bullet"${cls}>${item.text}</div>`;
    } else if (item.type === 'bullet') {
      html += `<div class="bullet">${item.text}</div>`;
    } else if (item.type === 'tags') {
      html += `<div>${item.tags.map(t => `<span class="skill-tag highlight">${t}</span>`).join('')}</div>`;
    } else if (item.type === 'blank') {
      html += `<br>`;
    }
  }
  document.getElementById('content-body').innerHTML = html;

  // Update menu active state
  document.querySelectorAll('.menu-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === section);
  });

  currentSection = section;
}

// ── Navigation ──
function navigateTo(idx) {
  if (idx >= 0 && idx < sections.length) {
    renderContent(sections[idx]);
  }
}

function navigateRelative(dir) {
  const idx = sections.indexOf(currentSection);
  navigateTo(idx + dir);
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  const idx = sections.indexOf(currentSection);

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    navigateRelative(1);
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    navigateRelative(-1);
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    // Just re-render current (acts as "select")
    renderContent(currentSection);
  } else if (e.key >= '1' && e.key <= '6') {
    navigateTo(parseInt(e.key) - 1);
  }
});

// ── Click handlers ──
document.querySelectorAll('.menu-item').forEach(el => {
  el.addEventListener('click', () => {
    renderContent(el.dataset.section);
  });
});

// ── Typewriter effect on load ──
function typewriter(element, text, speed = 30) {
  return new Promise(resolve => {
    let i = 0;
    element.textContent = '';
    const interval = setInterval(() => {
      if (i < text.length) {
        element.textContent += text.charAt(i);
        i++;
      } else {
        clearInterval(interval);
        resolve();
      }
    }, speed);
  });
}

async function init() {
  const typedEl = document.getElementById('typed-text');
  await typewriter(typedEl, 'cat resume.txt', 40);
  await new Promise(r => setTimeout(r, 400));
  renderContent('about');
}

init();
</script>
